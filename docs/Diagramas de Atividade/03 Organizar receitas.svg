<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="508px" preserveAspectRatio="none" style="width:670px;height:508px;background:#FFFFFF;" version="1.1" viewBox="0 0 670 508" width="670px" zoomAndPan="magnify"><title>Organizar receitas sem um sistema centralizado</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="381.6709" x="142.9106" y="32.9951">Organizar receitas sem um sistema centralizado</text></g><ellipse cx="341.0527" cy="57.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="388.707" x="146.6992" y="87.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="368.707" x="156.6992" y="108.4355">Juntar receitas espalhadas em pap&#233;is, mensagens e imagens</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="281.8027" x="200.1514" y="141.2656"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="261.8027" x="210.1514" y="162.4043">Separar por tipo, ocasi&#227;o ou ordem pessoal</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="295.3086" x="193.3984" y="195.2344"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="275.3086" x="203.3984" y="216.373">Reescrever ou copiar as receitas mais usadas</text><polygon fill="#F1F1F1" points="268.7148,249.2031,413.3906,249.2031,425.3906,261.2031,413.3906,273.2031,268.7148,273.2031,256.7148,261.2031,268.7148,249.2031" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="144.6758" x="268.7148" y="265.0112">A organiza&#231;&#227;o ficou clara?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="20.7539" x="235.9609" y="258.6089">Sim</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="21.6992" x="425.3906" y="258.6089">N&#227;o</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="325.8594" x="11" y="283.2031"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="305.8594" x="21" y="304.3418">Guardar em um caderno, pasta ou arquivo pessoal</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="302.6328" x="356.8594" y="283.2031"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="282.6328" x="366.8594" y="304.3418">Reorganizar categorias e eliminar duplicidades</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="280.8359" x="367.7578" y="337.1719"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="260.8359" x="377.7578" y="358.3105">Tentar uma nova estrutura de classifica&#231;&#227;o</text><polygon fill="#F1F1F1" points="341.0527,377.1406,353.0527,389.1406,341.0527,401.1406,329.0527,389.1406,341.0527,377.1406" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="243.1309" x="219.4873" y="421.1406"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="223.1309" x="229.4873" y="442.2793">Manter apenas as vers&#245;es mais &#250;teis</text><ellipse cx="341.0527" cy="486.1094" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="341