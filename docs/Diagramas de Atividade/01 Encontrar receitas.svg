<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="562px" preserveAspectRatio="none" style="width:741px;height:562px;background:#FFFFFF;" version="1.1" viewBox="0 0 741 562" width="741px" zoomAndPan="magnify"><title>Encontrar receitas sem um sistema centralizado</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="381.4932" x="178.3521" y="32.9951">Encontrar receitas sem um sistema centralizado</text></g><ellipse cx="388.0522" cy="57.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="338.8203" x="218.6421" y="87.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="318.8203" x="228.6421" y="108.4355">Perceber que deseja preparar uma receita espec&#237;fica</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="262.8418" x="256.6313" y="141.2656"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="242.8418" x="266.6313" y="162.4043">Lembrar de poss&#237;veis fontes de consulta</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="374.6621" x="200.7212" y="195.2344"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="354.6621" x="210.7212" y="216.373">Procurar em cadernos, conversas, fotos e anota&#231;&#245;es soltas</text><polygon fill="#F1F1F1" points="318.7947,249.2031,457.3098,249.2031,469.3098,261.2031,457.3098,273.2031,318.7947,273.2031,306.7947,261.2031,318.7947,249.2031" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="138.5151" x="318.7947" y="265.0112">A receita foi encontrada?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="20.7539" x="286.0408" y="258.6089">Sim</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="21.6992" x="469.3098" y="258.6089">N&#227;o</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="236.7793" x="84.8633" y="283.2031"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="216.7793" x="94.8633" y="304.3418">Ler ingredientes e modo de preparo</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="384.5059" x="11" y="337.1719"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="364.5059" x="21" y="358.3105">Adaptar quantidades com base na mem&#243;ria ou no improviso</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="128.416" x="139.0449" y="391.1406"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="108.416" x="149.0449" y="412.2793">Preparar a receita</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="249.7578" x="447.9727" y="283.2031"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="229.7578" x="457.9727" y="304.3418">Tentar refazer a busca em outra fonte</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="268.707" x="438.498" y="337.1719"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="248.707" x="448.498" y="358.3105">Perguntar a familiares, amigos ou grupos</text><rect fi