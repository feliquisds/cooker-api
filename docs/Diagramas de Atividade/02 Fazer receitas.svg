<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="562px" preserveAspectRatio="none" style="width:524px;height:562px;background:#FFFFFF;" version="1.1" viewBox="0 0 524 562" width="524px" zoomAndPan="magnify"><title>Fazer receitas sem um sistema centralizado</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="347.6895" x="87.0254" y="32.9951">Fazer receitas sem um sistema centralizado</text></g><ellipse cx="261.9878" cy="57.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="234.0078" x="144.9839" y="87.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="214.0078" x="154.9839" y="108.4355">Escolher uma receita para preparar</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="271.4023" x="126.2866" y="141.2656"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="251.4023" x="136.2866" y="162.4043">Separar ingredientes dispon&#237;veis em casa</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="317.4746" x="103.2505" y="195.2344"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="297.4746" x="113.2505" y="216.373">Comparar o que existe com o que a receita exige</text><polygon fill="#F1F1F1" points="203.929,249.2031,320.0466,249.2031,332.0466,261.2031,320.0466,273.2031,203.929,273.2031,191.929,261.2031,203.929,249.2031" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLeng