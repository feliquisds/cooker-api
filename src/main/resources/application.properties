spring.application.name=cooker
spring.data.mongodb.database=cooker
spring.data.mongodb.uri=mongodb://localhost:27017/cooker
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# JWT Configuration
app.jwt.secret=I&Si$9jys8#%8TZH%&tC2gHpPIt^NG6A
app.jwt.expiration=86400000

# Mail Configuration
# Configure these values for a real SMTP provider before enabling password recovery emails.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:${spring.mail.username:}}

# Data Seeder Configuration
app.seeder.enabled=false

# Email tester configuration
app.email-tester.enabled=true

# Allow null for primitives during deserialization (disable failure)
spring.jackson.deserialization.fail-on-null-for-primitives=false